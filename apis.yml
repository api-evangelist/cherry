aid: cherry
name: Cherry
description: 'Cherry is a fintech platform providing point-of-sale patient financing for healthcare
  and elective-services providers across dental, medical aesthetics, plastic surgery, dermatology,
  veterinary, and other verticals. Rather than lending directly, Cherry facilitates consumer payment
  plans through partner lenders, offering Pay-in-4 and longer-term monthly plans (0-35.99% APR), a
  60-second application with no hard credit check, upfront provider payout within 2-3 business days,
  and card-processing services. Cherry states it serves over 60,000 healthcare providers with an
  approximately 90% approval rate. Cherry is a portfolio company of DCM Ventures. Cherry does not
  publish a public developer API, developer portal, or OpenAPI at this time; this profile captures
  its public identity and security posture.'
